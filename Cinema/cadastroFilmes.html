<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Filmes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); min-height: 100vh; }
  .main-card { border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
  h2 { color: white; }
</style>

</head>
<body>

<div class="container py-5">

<h2 class="text-center mb-4">Cadastro de Filme</h2>

<div class="card main-card p-4">

<input id="titulo" class="form-control mb-3" placeholder="Título">
<input id="genero" class="form-control mb-3" placeholder="Gênero">
<textarea id="descricao" class="form-control mb-3" placeholder="Descrição"></textarea>
<input id="duracao" type="number" class="form-control mb-3" placeholder="Duração">

<button class="btn btn-primary w-100" onclick="salvarFilme()">Salvar</button>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
