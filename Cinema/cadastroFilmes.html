<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Filmes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;

    display: flex;
    flex-direction: column;
  }

  .main-card {
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }

  h2 {
    color: white;
    text-align: center;
  }

  .container {
    flex: 1;
  }
</style>

</head>
<body>

<!-- HEADER -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
  <div class="container">

    <a class="navbar-brand fw-bold" href="index.html">🎬 CineArt</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link active" href="cadastroFilmes.html">Filmes</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="cadastroSalas.html">Salas</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="cadastroSessoes.html">Sessões</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="vendaIngressos.html">Ingressos</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="sessoes.html">Sessões</a>
        </li>

      </ul>
    </div>

  </div>
</nav>

<!-- CONTEÚDO -->
<div class="container py-5">

<h2 class="mb-4">Cadastro de Filme</h2>

<div class="card main-card p-4">

<!-- TÍTULO -->
<input id="titulo" class="form-control mb-3" placeholder="Título">

<!-- GÊNERO -->
<input id="genero" class="form-control mb-3" placeholder="Gênero">

<!-- DESCRIÇÃO -->
<textarea id="descricao" class="form-control mb-3" placeholder="Descrição"></textarea>

<!-- CLASSIFICAÇÃO -->
<select id="classificacao" class="form-control mb-3">
  <option value="">Classificação Indicativa</option>
  <option>Livre</option>
  <option>10 anos</option>
  <option>12 anos</option>
  <option>14 anos</option>
  <option>16 anos</option>
  <option>18 anos</option>
</select>

<!-- DURAÇÃO -->
<input id="duracao" type="number" class="form-control mb-3" placeholder="Duração (minutos)">

<!-- DATA DE ESTREIA -->
<input id="estreia" type="date" class="form-control mb-3" placeholder="Data de Estreia">

<!-- BOTÃO -->
<button class="btn btn-primary w-100" onclick="salvarFilme()">Salvar</button>

</div>

</div>

<!-- FOOTER -->
<footer class="text-center text-white mt-5 p-4" style="background: rgba(0, 0, 0, 0.7);">
  <div class="container">

    <h5>CineArt</h5>
    <p class="mb-1"><strong>CineArt</strong> - O melhor do cinema</p>
    <small>&copy; 2026 CineArt. Todos os direitos reservados. ocarlosdigital@gmail.com</small>

  </div>
</footer>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
