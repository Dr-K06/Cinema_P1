<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sessões</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); min-height: 100vh; }
  .main-card { border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
  h2 { color: white; }
</style>

</head>
<body>
    

<div class="container py-5">

<h2 class="text-center mb-4">Cadastro de Sessão</h2>

<div class="card main-card p-4">

<select id="filme" class="form-control mb-3"></select>
<select id="sala" class="form-control mb-3"></select>

<input id="data" type="datetime-local" class="form-control mb-3">
<input id="preco" type="number" class="form-control mb-3">

<button class="btn btn-warning w-100" onclick="salvarSessao()">Salvar</button>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
